[package]
name = "hyprvisor"
version = "0.4.4"
edition = "2021"

[features]
default = []
hyprland = []


[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
fern = "0.7.1"
humantime = "2.2.0"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
once_cell = "1.21.3"
bincode = { version = "2.0.1", features = ["serde"] }
futures = "0.3.31"
bluer = { version = "0.17.4", features = ["full"] }
